services:
  fastapi-ap:
    image:  ghcr.io/liaozhimingandy/fastapi-ap:sha-ca34c89 # 上线建议固定到具体版本标签
    restart: unless-stopped
    container_name: prod-ap-alsoapp-api-01
    extra_hosts:
      - host.docker.internal:host-gateway
    env_file:
      - .env
    environment:
      CORS_ORIGINS: "https://www.alsoapp.com"   # 与前端部署域名一致，多个用逗号分隔
      APP_ENV: "production"
    networks:
      - proxy
    # 不暴露宿主机端口，全部由 Traefik 走内部网络转发
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.fastapi-ap.rule=Host(`api.alsoapp.com`)"
      - "traefik.http.routers.fastapi-ap.entrypoints=websecure"
      - "traefik.http.routers.fastapi-ap.tls=true"
      - "traefik.http.routers.fastapi-ap.service=fastapi-ap"

      # Service
      - "traefik.http.services.fastapi-ap.loadbalancer.server.port=8000"

      # Middlewares
      - "traefik.http.routers.fastapi-ap.middlewares=compress@file,security-headers@file"

networks:
  proxy:
    external: true