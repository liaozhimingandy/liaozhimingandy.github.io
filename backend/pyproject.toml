[project]
name = "backend"
version = "0.4.0"
description = "AP backend: static SPA host + zero-knowledge config store + article pipeline"
readme = "README.md"
requires-python = ">=3.14"  # uuid.uuid7() 内置于 3.14；调度器 Event.wait 语义亦以 3.14 为准
dependencies = [
    "fastapi>=0.165.0",
    "langchain-openai>=1.8.5",
    "langgraph>=1.2.24",
    "langgraph-checkpoint-postgres>=2.0",  # LangGraph 检查点存 Postgres
    "loguru>=0.7",                # 统一日志出口（app/core/logger.py）
    "psycopg[binary,pool]>=3.2",      # Postgres 驱动（业务库 + 检查点共用）
    "pydantic-settings>=2.7",         # Settings 单例（.env 自动加载，已依赖 python-dotenv）
    "sqlmodel>=0.0.24",               # 表模型 + SQLModel.metadata.create_all 自动建表
    "aiosqlite>=0.21",                # SQLite 异步驱动（memory 降级 / 测试）
    "sqlalchemy[asyncio]>=2.1.9",
    "uvicorn>=0.54.0",
    "trafilatura>=2.4.0",             # 正文提取（采集核心依赖，随服务默认安装）
]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[project.optional-dependencies]
# article 流水线的采集/聚合依赖（uv sync --extra article）。
# 均做了优雅降级：缺哪个，对应能力关闭，不影响 API 服务启动。
article = [
    "requests>=2.32",
    "lxml>=5.0",              # <title> 兜底提取（可选）
    "numpy>=2.0",             # 聚合向量精判（可选，缺失只用 SimHash）
    "simhash>=2.1",           # SimHash 外部实现（可选，有内置 fallback）
    "pillow>=10.0",           # 图片 logo/横幅识别（可选）
]
# jieba（标题相关性分词）：wheel 覆盖不稳定、源码构建依赖编译器，且代码已有
# 字符二元组降级路径，故不进默认 extra。需要时手动：
#   uv pip install jieba
# 重量级向量模型（torch 等），只在需要 embedding 精判时安装：
# uv sync --extra article --extra ml
ml = [
    "sentence-transformers>=3.0",  # all-MiniLM-L6-v2 向量模型
]
# 开发调试：LangGraph 检查点 SQLite（AP_CHECKPOINT_SQLITE 指定文件路径时启用）。
# 生产用 PostgresSaver（langgraph-checkpoint-postgres，已进默认依赖），无需此 extra。
#   uv sync --extra dev
dev = [
    "langgraph-checkpoint-sqlite>=2.0",
]
