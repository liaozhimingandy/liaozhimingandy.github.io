<!DOCTYPE html>
<!--
  占位文件：真正部署的 404.html 由 scripts/spa-fallback.mjs 在构建后生成，
  内容直接等于 index.html（history 路由：深路径由 vue-router 按当前 URL 渲染）。

  不要在这里写 sessionStorage 跳转逻辑：
    1. CDN 缓存旧 index.html 时，跳回首页再恢复的机制会失效（/admin/apps/ 跳首页）；
    2. /tools/* 前缀走另一条 CDN 回源规则，根本拿不到本站的 404.html（原生 404）。
  物理深路径入口 + 404.html=index.html 才是对 GitHub Pages 可靠的方式。
-->
<html lang="zh-CN">
  <head><meta charset="UTF-8" /><title>Also Apps</title></head>
  <body>页面跳转中…</body>
</html>
