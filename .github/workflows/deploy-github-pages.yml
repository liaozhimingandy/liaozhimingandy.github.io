# =============================================================================
# AP（Also Apps）前端部署：构建统一站点（门户 + 官网）并发布到 GitHub Pages
#
# 部署形态（与 backend/.env.example、deploy-defaults.test.ts 的契约一致）：
#   - 自定义域 www.alsoapp.com 根路径部署（Vite base=/，CNAME 在 frontend/public/CNAME）；
#   - 前端 history 路由（/products/ 等），深路径靠构建产物 dist/404.html 兜底：
#     构建后 cp dist/index.html dist/404.html，Pages 对未知路径返回同一份 SPA 入口，
#     vue-router 按当前 URL 直接渲染，无需 sessionStorage 跳转；
#   - API 根 https://api.alsoapp.com（后端镜像 fastapi-ap，跨源，CORS 白名单含本域）；
#   - Logto 回调/登出回跳 = https://www.alsoapp.com/（与访问域同 origin，不带 fragment，
#     否则 301 跨 origin 丢 sessionStorage 且未在 Logto 登记）。
#
# 生产环境变量默认值放 frontend/.env.production（vite build 自动加载），保证仓库
# 开箱即用；本工作流只透传 GitHub Actions Variables（vars.VITE_*）、不内联具体值，
# 既保持通用又保留控制台覆盖能力（Settings → Variables 改值后重新部署即生效）。
# 注意：vars 未设置时 GitHub 注入空串会盖掉 .env.production，故 Build 步骤会先
# 剔除空值变量，让 Vite 回退到文件默认值。敏感值不进前端产物。
#
# 触发：push main 且 frontend/** 或本工作流变化；workflow_dispatch 手动。
# =============================================================================
name: Deploy AP Frontend to Pages

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-github-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # 默认值读 frontend/.env.production；vars.VITE_* 若配置则覆盖（空值不算配置）。
      - name: Build（.env.production 默认值，vars 可覆盖）
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_LOGTO_ENDPOINT: ${{ vars.VITE_LOGTO_ENDPOINT }}
          VITE_LOGTO_APP_ID: ${{ vars.VITE_LOGTO_APP_ID }}
          VITE_LOGTO_REDIRECT_URI: ${{ vars.VITE_LOGTO_REDIRECT_URI }}
          VITE_LOGTO_POST_LOGOUT_REDIRECT_URI: ${{ vars.VITE_LOGTO_POST_LOGOUT_REDIRECT_URI }}
        run: |
          # GitHub 未设置的 vars 会注入空串，Vite 视其为已定义从而盖掉 .env.production；
          # 这里剔除空值，让 Vite 回退文件默认值（非空值则保留为覆盖）。
          for k in VITE_API_BASE_URL VITE_LOGTO_ENDPOINT VITE_LOGTO_APP_ID VITE_LOGTO_REDIRECT_URI VITE_LOGTO_POST_LOGOUT_REDIRECT_URI; do
            if [ -z "$(printenv "$k")" ]; then unset "$k"; fi
          done
          npm run build

      # history 路由深路径兜底：Pages 对找不到的路径返回 404.html，
      # 内容直接等于 index.html，由 vue-router 按当前 URL 渲染对应页面。
      - name: 生成 404.html（cp index.html）
        working-directory: frontend/dist
        run: cp index.html 404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Output cache-buster URL
        run: |
          TS=$(date +%s)
          echo "公网验证地址（绕过 CDN 缓存）: https://www.alsoapp.com/?v=${TS}"
          echo "部署完成。应用中心入口: https://www.alsoapp.com/products/"
