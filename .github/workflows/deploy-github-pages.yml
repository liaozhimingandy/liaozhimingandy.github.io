# =============================================================================
# AP（Also Apps）前端部署：构建统一站点（门户 + 官网）并发布到 GitHub Pages
#
# 部署形态（与 backend/.env.example、deploy-defaults.test.ts 的契约一致）：
#   - 自定义域 www.alsoapp.com 根路径部署（Vite base=/，CNAME 在 frontend/public/CNAME）；
#   - 前端 history 路由（/products/ 等），深路径靠构建产物 dist/404.html 兜底：
#     构建后 cp dist/index.html dist/404.html，Pages 对未知路径返回同一份 SPA 入口，
#     vue-router 按当前 URL 直接渲染，无需 sessionStorage 跳转；
#   - API 根 https://api.alsoapp.com（后端镜像 fastapi-ap，跨源，CORS 白名单含本域）；
#   - Logto 回调/登出回跳 = https://www.alsoapp.com/（与访问域同 origin，不带 fragment，
#     否则 301 跨 origin 丢 sessionStorage 且未在 Logto 登记）。
#
# 触发：push main 且 frontend/** 或本工作流变化；workflow_dispatch 手动。
# =============================================================================
name: Deploy AP Frontend to Pages

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-github-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build（生产默认值内联，可被 vars 覆盖）
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'https://api.alsoapp.com' }}
          VITE_LOGTO_ENDPOINT: ${{ vars.VITE_LOGTO_ENDPOINT || 'https://account.alsoapp.com' }}
          # 回调落在站点根（redirect_uri 禁止带 fragment(#)），由 main.ts 挂载前消费 code/state
          VITE_LOGTO_REDIRECT_URI: ${{ vars.VITE_LOGTO_REDIRECT_URI || 'https://www.alsoapp.com/' }}
          VITE_LOGTO_POST_LOGOUT_REDIRECT_URI: ${{ vars.VITE_LOGTO_POST_LOGOUT_REDIRECT_URI || 'https://www.alsoapp.com/' }}
        run: npm run build

      # history 路由深路径兜底：Pages 对找不到的路径返回 404.html，
      # 内容直接等于 index.html，由 vue-router 按当前 URL 渲染对应页面。
      - name: 生成 404.html（cp index.html）
        working-directory: frontend/dist
        run: cp index.html 404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Output cache-buster URL
        run: |
          TS=$(date +%s)
          echo "公网验证地址（绕过 CDN 缓存）: https://www.alsoapp.com/?v=${TS}"
          echo "部署完成。应用中心入口: https://www.alsoapp.com/products/"
